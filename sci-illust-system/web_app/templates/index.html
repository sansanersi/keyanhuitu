<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科研配图管理系统</title>
<style>
:root {
  --bg: #eef3f8;
  --panel: #ffffff;
  --panel-soft: #f7fafc;
  --text: #172033;
  --muted: #667085;
  --line: #dce4ee;
  --brand: #2368d1;
  --brand-dark: #174c9f;
  --ink: #0f172a;
  --cyan: #0e7490;
  --green: #0f766e;
  --orange: #b45309;
  --red: #b91c1c;
  --shadow: 0 18px 45px rgba(22, 36, 57, 0.08);
  --shadow-soft: 0 8px 24px rgba(22, 36, 57, 0.06);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-spring: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--text);
  background:
    linear-gradient(135deg, rgba(35,104,209,.08), transparent 32%),
    linear-gradient(180deg, #f8fbff 0, var(--bg) 360px);
  animation: appFadeIn .6s var(--ease-out) both;
}
button, input, select, textarea { font: inherit; }
button {
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transform: translateZ(0);
  transition:
    background .18s var(--ease-out),
    color .18s var(--ease-out),
    box-shadow .22s var(--ease-out),
    transform .18s var(--ease-spring),
    border-color .18s var(--ease-out);
}
button:disabled { cursor: not-allowed; opacity: .65; }
button:active { transform: translateY(1px) scale(.985); }
.app {
  display: grid;
  grid-template-columns: 248px 1fr;
  min-height: 100vh;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background:
    linear-gradient(180deg, #0d1830 0%, #101827 54%, #0a111e 100%);
  color: #fff;
  padding: 24px 16px;
  box-shadow: inset -1px 0 rgba(255,255,255,.08);
  animation: sidebarSlideIn .7s var(--ease-out) both;
}
.brand {
  padding: 0 8px 24px;
  border-bottom: 1px solid rgba(255,255,255,.12);
  margin-bottom: 18px;
  animation: slideUp .58s var(--ease-out) both;
}
.brand h1 {
  margin: 0 0 6px;
  font-size: 19px;
  line-height: 1.3;
  letter-spacing: 0;
}
.brand p {
  margin: 0;
  color: #b6c3d6;
  font-size: 12px;
  line-height: 1.6;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 11px 12px;
  margin-bottom: 8px;
  border-radius: 8px;
  color: #cbd5e1;
  background: transparent;
  text-align: left;
  font-weight: 600;
  isolation: isolate;
  transform-origin: left center;
}
.nav-item::before {
  content: "";
  position: absolute;
  inset: 7px auto 7px 8px;
  width: 3px;
  border-radius: 999px;
  background: #7dd3fc;
  opacity: 0;
  transform: scaleY(.35);
  transition: opacity .22s var(--ease-out), transform .22s var(--ease-out);
}
.nav-item:hover {
  background: rgba(255,255,255,.08);
  color: #fff;
  transform: translateX(3px);
}
.nav-item.active {
  background: linear-gradient(135deg, #2f72df, #1857b8);
  color: #fff;
  box-shadow: 0 10px 26px rgba(24, 87, 184, .34);
}
.nav-item.active::before {
  opacity: 1;
  transform: scaleY(1);
}
.main {
  min-width: 0;
  padding: 26px 28px;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
  animation: slideUp .62s .08s var(--ease-out) both;
}
.topbar h2 {
  margin: 0;
  font-size: 26px;
  line-height: 1.2;
  letter-spacing: 0;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.86);
  color: var(--muted);
  font-size: 13px;
  box-shadow: var(--shadow-soft);
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}
.page {
  display: none;
  transform-origin: top center;
}
.page.active {
  display: block;
  animation: pageEnter .5s var(--ease-out) both;
}
.grid {
  display: grid;
  gap: 16px;
}
.stats-grid {
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 20px;
  box-shadow: var(--shadow);
  transform: translateZ(0);
  transition:
    transform .28s var(--ease-out),
    box-shadow .28s var(--ease-out),
    border-color .28s var(--ease-out),
    background .28s var(--ease-out);
}
.card:hover {
  transform: translateY(-4px) scale(1.004);
  border-color: rgba(35, 104, 209, .24);
  box-shadow: 0 24px 60px rgba(22, 36, 57, .13);
}
.card.compact { padding: 16px; }
.card.surface {
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(10px);
}
.metric-label {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 10px;
}
.metric-value {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.metric-note {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.section-title h3 {
  margin: 0;
  font-size: 16px;
}
.muted { color: var(--muted); }
.workflow-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.workflow-step {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-soft);
  transition: transform .24s var(--ease-out), box-shadow .24s var(--ease-out), border-color .24s var(--ease-out);
}
.workflow-step:hover {
  transform: translateY(-3px);
  border-color: rgba(35, 104, 209, .22);
  box-shadow: var(--shadow-soft);
}
.workflow-step strong {
  display: block;
  margin-bottom: 6px;
  color: var(--ink);
  font-size: 13px;
}
.workflow-step span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.field {
  width: 100%;
  min-height: 40px;
  padding: 9px 11px;
  border: 1px solid #cfd8e3;
  border-radius: 6px;
  background: #fff;
  color: var(--text);
  outline: none;
  transition:
    border-color .2s var(--ease-out),
    box-shadow .2s var(--ease-out),
    transform .2s var(--ease-out),
    background .2s var(--ease-out);
}
.field:focus {
  border-color: rgba(35,104,209,.75);
  box-shadow: 0 0 0 3px rgba(35,104,209,.12);
  transform: translateY(-1px);
  background: #fff;
}
.toolbar .field { max-width: 260px; }
.btn {
  min-height: 38px;
  padding: 8px 14px;
  background: #eef2ff;
  color: var(--brand-dark);
}
.btn:hover {
  background: #dbeafe;
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(35, 104, 209, .12);
}
.btn-primary {
  background: linear-gradient(135deg, #2f76e5, #1956b8);
  color: #fff;
  box-shadow: 0 8px 18px rgba(35, 104, 209, .22);
}
.btn-primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,.38) 38%, transparent 62%);
  transform: translateX(-130%);
  transition: transform .62s var(--ease-out);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #3b82f6, #174c9f);
  transform: translateY(-1px);
  box-shadow: 0 14px 30px rgba(35, 104, 209, .28);
}
.btn-primary:hover::after { transform: translateX(130%); }
.btn-danger {
  background: #fee2e2;
  color: var(--red);
}
.btn-danger:hover { background: #fecaca; }
.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
}
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 13px;
}
th, td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
th {
  background: var(--panel-soft);
  color: #4b5563;
  font-weight: 600;
  white-space: nowrap;
}
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f8fbff; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #eef4ff;
  color: var(--brand-dark);
  font-size: 12px;
  font-weight: 600;
  transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out);
}
.badge:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(15, 23, 42, .08);
}
.badge.biology { background: #ecfeff; color: #0e7490; }
.badge.chemistry { background: #fff7ed; color: var(--orange); }
.badge.materials { background: #f0fdf4; color: #15803d; }
.badge.environment { background: #fefce8; color: #a16207; }
.empty {
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.empty strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 16px;
}
.empty span {
  display: block;
  max-width: 420px;
  line-height: 1.7;
}
.draw-layout {
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 18px;
  min-height: calc(100vh - 130px);
}
.draw-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.draw-panel .card {
  position: sticky;
  top: 24px;
}
.draw-panel textarea {
  min-height: 190px;
  resize: vertical;
  line-height: 1.6;
}
.form-label {
  display: block;
  margin: 0 0 6px;
  color: #374151;
  font-size: 13px;
  font-weight: 600;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.preview {
  display: flex;
  flex-direction: column;
  min-height: 620px;
}
.preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.preview-body {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 22px;
  overflow: auto;
  background:
    linear-gradient(0deg, rgba(255,255,255,.95) 0, rgba(255,255,255,.95) 23px, #edf2f7 24px),
    linear-gradient(90deg, transparent 0, transparent 23px, #edf2f7 24px);
  background-size: 24px 24px;
  border-radius: 7px;
  margin-top: 14px;
  border: 1px solid #edf2f7;
  transition: border-color .24s var(--ease-out), box-shadow .24s var(--ease-out), background-position .8s var(--ease-out);
}
.preview:hover .preview-body {
  border-color: rgba(35,104,209,.2);
  box-shadow: inset 0 0 0 1px rgba(35,104,209,.08);
  background-position: 0 8px, 8px 0;
}
.preview-body .empty {
  display: grid;
  place-items: center;
}
.preview-body svg {
  max-width: 100%;
  height: auto;
  background: #fff;
  border-radius: 6px;
  box-shadow: 0 18px 45px rgba(15, 23, 42, .12);
  transition: transform .36s var(--ease-out), box-shadow .36s var(--ease-out), filter .36s var(--ease-out);
  animation: svgPop .52s var(--ease-out) both;
}
.preview-body svg:hover {
  transform: scale(1.018);
  box-shadow: 0 24px 70px rgba(15, 23, 42, .16);
  filter: saturate(1.03);
}
.analysis {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  max-width: 360px;
  padding: 11px 14px;
  border-radius: 8px;
  background: #111827;
  color: #fff;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.reveal {
  opacity: 0;
  transform: translateY(16px) scale(.985);
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  transition:
    opacity .55s var(--ease-out),
    transform .55s var(--ease-out);
  transition-delay: var(--reveal-delay, 0ms);
}
@keyframes appFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes sidebarSlideIn {
  from { opacity: 0; transform: translateX(-18px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(14px) scale(.992); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes svgPop {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .001ms !important;
  }
}
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.32);
  backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s var(--ease-out);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-content {
  width: 90%;
  max-width: 540px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 32px 80px rgba(0,0,0,.22);
  transform: translateY(12px) scale(.98);
  transition: transform .25s var(--ease-out);
}
.modal-overlay.open .modal-content {
  transform: translateY(0) scale(1);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.modal-header h3 {
  margin: 0;
  font-size: 16px;
}
.modal-close {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--muted);
  border-radius: 50%;
}
.modal-close:hover {
  background: #f1f4f8;
  color: var(--ink);
}
.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px;
  border-top: 1px solid var(--line);
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 14px;
  }
  .brand { padding-bottom: 12px; margin-bottom: 10px; }
  .sidebar nav { display: flex; overflow-x: auto; gap: 8px; }
  .nav-item { width: auto; white-space: nowrap; margin-bottom: 0; }
  .main { padding: 16px; }
  .draw-layout { grid-template-columns: 1fr; }
  .workflow-grid { grid-template-columns: 1fr 1fr; }
  .analysis, .form-row { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .workflow-grid { grid-template-columns: 1fr; }
  .topbar { align-items: flex-start; flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>科研配图管理系统</h1>
      <p>知识库、结构化绘图与本地模型集成</p>
    </div>
    <nav>
      <button class="nav-item active" data-page="dashboard" type="button">仪表盘</button>
      <button class="nav-item" data-page="entries" type="button">知识条目</button>
      <button class="nav-item" data-page="draw" type="button">科研绘图</button>
      <button class="nav-item" data-page="documents" type="button">文档管理</button>
      <button class="nav-item" data-page="search" type="button">知识检索</button>
      <button class="nav-item" data-page="elements" type="button">元素库</button>
      <button class="nav-item" data-page="dify" type="button">Dify 集成</button>
      <button class="nav-item" data-page="settings" type="button">设置</button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="page-title">仪表盘</h2>
      <span class="status-pill"><span class="dot"></span><span id="app-status">正在加载系统状态</span></span>
    </div>

    <section id="page-dashboard" class="page active">
      <div id="dashboard-content" class="grid stats-grid"></div>
    </section>

    <section id="page-entries" class="page">
      <div class="card">
        <div class="section-title">
          <h3>知识条目</h3>
          <span class="muted" id="entries-count">加载中</span>
        </div>
        <div class="toolbar">
          <input class="field" id="entry-search" placeholder="搜索中文名、英文名或标签">
          <select class="field" id="entry-domain">
            <option value="">全部学科</option>
            <option value="biology">生物</option>
            <option value="chemistry">化学</option>
            <option value="materials">材料</option>
            <option value="environment">环境</option>
          </select>
          <button class="btn-primary" type="button" id="entry-search-btn">搜索</button>
          <button class="btn" type="button" id="entry-reset-btn">重置</button>
        </div>
        <div id="entries-table" class="table-wrap"></div>
      </div>
    </section>

    <section id="page-draw" class="page">
      <div class="draw-layout">
        <div class="draw-panel">
          <div class="card">
            <div class="section-title">
              <h3>绘图需求</h3>
              <span class="badge">SVG 输出</span>
            </div>
            <label class="form-label" for="draw-input">需求描述</label>
            <textarea class="field" id="draw-input" placeholder="例如：EGF 配体结合 EGFR 受体，激活 RAS 激酶，并将信号传递到细胞核。"></textarea>
            <div class="form-row">
              <div>
                <label class="form-label" for="draw-layout-select">布局</label>
                <select class="field" id="draw-layout-select">
                  <option value="">自动</option>
                  <option value="hierarchical">层级布局</option>
                  <option value="force_directed">力导向布局</option>
                  <option value="grid">网格布局</option>
                  <option value="radial">径向布局</option>
                </select>
              </div>
              <div>
                <label class="form-label" for="draw-style-select">风格</label>
                <select class="field" id="draw-style-select">
                  <option value="science">科学示意</option>
                  <option value="nature">Nature 风格</option>
                  <option value="cell">Cell 风格</option>
                  <option value="minimal">极简风格</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label class="form-label" for="draw-size-select">画布</label>
                <select class="field" id="draw-size-select">
                  <option value="900x600">900 x 600</option>
                  <option value="1200x800">1200 x 800</option>
                  <option value="600x400">600 x 400</option>
                </select>
              </div>
              <div>
                <label class="form-label" for="draw-model-select">模型</label>
                <select class="field" id="draw-model-select">
                  <option value="">关键词/知识库</option>
                </select>
              </div>
            </div>
            <div class="toolbar" style="margin:12px 0 0">
              <button class="btn-primary" type="button" id="draw-submit">生成配图</button>
              <button class="btn" type="button" id="draw-example">填入示例</button>
            </div>
          </div>
        </div>

        <div class="card preview">
          <div class="preview-head">
            <div>
              <h3 style="margin:0 0 4px">生成预览</h3>
              <div class="muted" id="draw-summary">等待输入绘图需求</div>
            </div>
            <button class="btn" type="button" id="download-svg" disabled>下载 SVG</button>
          </div>
          <div class="preview-body" id="svg-preview">

<div id="toast" class="toast"></div>
<!-- edit modal -->
<script>
var lastSvg = "";
var pageTitles = {
  dashboard: "仪表盘",
  entries: "知识条目",
  draw: "科研绘图",
  documents: "文档管理",
  search: "知识检索",
  elements: "元素库",
  dify: "Dify 集成",
  settings: "设置"
};
var revealObserver = null;
var enhanceTimer = null;

function $(id) {
  return document.getElementById(id);
}

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function toast(message) {
  var el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 2400);
}

function request(method, url, body) {
  var options = { method: method, headers: {} };
  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  return fetch(url, options).then(function(response) {
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  });
}

function animateNumber(element, target) {
  var end = Number(target);
  if (!Number.isFinite(end)) return;
  var duration = 820;
  var startTime = performance.now();
  function frame(now) {
    var progress = Math.min((now - startTime) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    element.textContent = Math.round(end * eased);
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function enhanceMotion(scope) {
  var root = scope || document;
  var motionTargets = root.querySelectorAll(".card, .workflow-step, .table-wrap, .preview, tbody tr");
  if (!revealObserver) {
    revealObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -36px 0px" });
  }
  motionTargets.forEach(function(target, index) {
    if (!target.classList.contains("reveal")) {
      target.classList.add("reveal");
      target.style.setProperty("--reveal-delay", Math.min(index * 36, 240) + "ms");
      revealObserver.observe(target);
    }
  });

  root.querySelectorAll(".metric-value").forEach(function(value) {
    var text = value.textContent.trim();
    if (value.dataset.animated || !/^\d+$/.test(text)) return;
    value.dataset.animated = "true";
    animateNumber(value, text);
  });
}

function scheduleEnhance(scope) {
  clearTimeout(enhanceTimer);
  enhanceTimer = setTimeout(function() {
    enhanceMotion(scope || document);
  }, 40);
}

function domainLabel(domain) {
  var map = {
    biology: "生物",
    chemistry: "化学",
    materials: "材料",
    environment: "环境",
    general: "通用"
  };
  return map[domain] || domain || "未分类";
}

function badge(domain) {
  return "<span class=\"badge " + escapeHtml(domain || "") + "\">" + escapeHtml(domainLabel(domain)) + "</span>";
}

function switchPage(name) {
  document.querySelectorAll(".page").forEach(function(page) {
    page.classList.remove("active");
  });
  document.querySelectorAll(".nav-item").forEach(function(item) {
    item.classList.toggle("active", item.dataset.page === name);
  });
  $("page-" + name).classList.add("active");
  $("page-title").textContent = pageTitles[name] || "";
  if (name === "dashboard") loadDashboard();
  if (name === "entries") loadEntries();
  if (name === "documents") loadDocuments();
  if (name === "settings") loadSettings();
  scheduleEnhance($("page-" + name));
}

function openEditModal(id) {
  request("GET", "/api/entries?search=" + encodeURIComponent("")).then(function(data) {
    var entry = null;
    if (data.entries) {
      data.entries.forEach(function(e) {
        if (String(e.id) === String(id)) entry = e;
      });
    }
    if (!entry) { toast("未找到条目"); return; }
    $("edit-id").value = entry.id;
    $("edit-name").value = entry.name || "";
    $("edit-english").value = entry.english || "";
    $("edit-domain").value = entry.domain || "";
    $("edit-category").value = entry.category || "";
    $("edit-shape").value = entry.shape || "";
    $("edit-color-scheme").value = entry.color_scheme || "";
    $("edit-description").value = entry.description || "";
    var tags = [];
    try { tags = JSON.parse(entry.tags || "[]"); } catch(e) {}
    $("edit-tags").value = tags.join(", ");
    var modal = $("edit-modal");
    modal.style.display = "flex";
    modal.offsetHeight;
    modal.classList.add("open");
  }).catch(function(error) {
    toast("加载条目失败: " + error.message);
  });
}





function deleteEntry(id) {
  if (!confirm("确定要删除此条目吗？此操作不可撤销。")) return;
  request("DELETE", "/api/entries/" + id).then(function() {
    toast("条目已删除");
    loadEntries();
  }).catch(function(error) {
    toast("删除失败: " + error.message);
  });
}

function loadDashboard() {
  request("GET", "/api/dashboard").then(function(data) {
    $("app-status").textContent = "知识库 " + data.entries + " 条，Ollama 模型 " + (data.ollama_models || []).length + " 个";
    var cards = [
      ["知识条目", data.entries],
      ["内置术语", data.kb_terms],
      ["向量索引", data.kb_vectors],
      ["文档数量", data.documents],
      ["已向量化文档", data.vectorized_documents || 0],
      ["Ollama 模型", (data.ollama_models || []).length]
    ];
    var html = cards.map(function(item) {
      return "<div class=\"card compact surface\"><div class=\"metric-label\">" + item[0] + "</div><div class=\"metric-value\">" + item[1] + "</div><div class=\"metric-note\">当前工作区</div></div>";
    }).join("");
    html += "<div class=\"card surface\" style=\"grid-column:1/-1\"><div class=\"section-title\"><h3>学科分布</h3><span class=\"muted\">来自知识库条目</span></div>";
    html += "<div class=\"tag-list\">";
    Object.keys(data.domains || {}).forEach(function(domain) {
      html += "<span class=\"badge " + escapeHtml(domain) + "\">" + escapeHtml(domainLabel(domain)) + " " + data.domains[domain] + "</span>";
    });
    html += "</div></div>";
    html += "<div class=\"card surface\" style=\"grid-column:1/-1\"><div class=\"section-title\"><h3>绘图工作流</h3><span class=\"muted\">从需求到 SVG</span></div>";
    html += "<div class=\"workflow-grid\">";
    html += "<div class=\"workflow-step\"><strong>需求解析</strong><span>提取学科、图类型和核心术语。</span></div>";
    html += "<div class=\"workflow-step\"><strong>知识召回</strong><span>从本地知识库匹配元素和图元。</span></div>";
    html += "<div class=\"workflow-step\"><strong>结构绘制</strong><span>按布局和风格生成 SVG 草图。</span></div>";
    html += "<div class=\"workflow-step\"><strong>人工微调</strong><span>下载后可继续编辑矢量文件。</span></div>";
    html += "</div></div>";
    $("dashboard-content").innerHTML = html;
  }).catch(function(error) {
    $("dashboard-content").innerHTML = "<div class=\"card empty\">仪表盘加载失败：" + escapeHtml(error.message) + "</div>";
  });
}

function loadEntries() {
  var domain = $("entry-domain").value;
  var search = $("entry-search").value.trim();
  var query = new URLSearchParams();
  if (domain) query.set("domain", domain);
  if (search) query.set("search", search);
  $("entries-table").innerHTML = "<div class=\"empty\">正在加载知识条目</div>";
  request("GET", "/api/entries" + (query.toString() ? "?" + query.toString() : "")).then(function(data) {
    $("entries-count").textContent = "共 " + data.total + " 条";
    if (!data.entries || !data.entries.length) {
      $("entries-table").innerHTML = "<div class=\"empty\">没有找到匹配的知识条目。</div>";
      return;
    }
var html = "<table><thead><tr><th>名称</th><th>英文名</th><th>学科</th><th>类别</th><th>图元</th><th>标签</th><th>操作</th></tr></thead><tbody>";
    data.entries.forEach(function(entry) {
      var tags = [];
      try { tags = JSON.parse(entry.tags || "[]"); } catch (e) { tags = []; }
      html += "<tr data-id=\"" + entry.id + "\">";
      html += "<td><strong>" + escapeHtml(entry.name) + "</strong></td>";
      html += "<td>" + escapeHtml(entry.english || "-") + "</td>";
      html += "<td>" + badge(entry.domain) + "</td>";
      html += "<td>" + escapeHtml(entry.category || "-") + "</td>";
      html += "<td>" + escapeHtml(entry.shape || "-") + "</td>";
      html += "<td>" + (tags.length ? tags.slice(0, 5).map(function(tag) { return "<span class=\"badge\">" + escapeHtml(tag) + "</span>"; }).join(" ") : "<span class=\"muted\">无</span>") + "</td>";
      html += '<td><button class="btn" style="min-height:30px;padding:4px 10px;font-size:12px;margin-right:6px" onclick="openEditModal(\'' + entry.id + '\')">编辑</button><button class="btn-danger" style="min-height:30px;padding:4px 10px;font-size:12px" onclick="deleteEntry(\'' + entry.id + '\')">删除</button></td>';
      html += "</tr>";
    });
    html += "</tbody></table>";
    $("entries-table").innerHTML = html;
  }).catch(function(error) {
    $("entries-table").innerHTML = "<div class=\"empty\">知识条目加载失败：" + escapeHtml(error.message) + "</div>";
});
}

function loadModels() {
request("GET", "/api/draw/models").then(function(data) {
    var select = $("draw-model-select");
    (data.models || []).forEach(function(model) {
      var option = document.createElement("option");
      option.value = model;
      option.textContent = model;
      select.appendChild(option);
    });
  }).catch(function() {
    $("draw-model-select").innerHTML = "<option value=\"\">关键词/知识库</option>";
  });
}

function renderTags(targetId, items, emptyText) {
  var target = $(targetId);
  if (!items || !items.length) {
    target.innerHTML = "<span class=\"muted\">" + emptyText + "</span>";
    return;
  }
  target.innerHTML = items.map(function(item) {
    return "<span class=\"badge\">" + escapeHtml(item.name || item.source + " -> " + item.target) + "</span>";
  }).join("");
}

function generateDrawing() {
  var text = $("draw-input").value.trim();
  if (!text) {
    toast("请先输入科研绘图需求");
    $("draw-input").focus();
    return;
  }
  var size = $("draw-size-select").value.split("x");
  var payload = {
    text: text,
    layout: $("draw-layout-select").value,
    style: $("draw-style-select").value,
    model: $("draw-model-select").value,
    canvas_width: parseInt(size[0], 10),
    canvas_height: parseInt(size[1], 10)
  };
  var button = $("draw-submit");
  button.disabled = true;
  button.textContent = "生成中";
  $("draw-summary").textContent = "正在分析需求并生成 SVG";
  $("svg-preview").innerHTML = "<div class=\"empty\"><strong>正在生成</strong><span>系统正在检索知识库并组装 SVG，请稍候。</span></div>";
  request("POST", "/api/draw", payload).then(function(data) {
    if (!data.success) throw new Error(data.error || "生成失败");
    lastSvg = data.svg || "";
    $("svg-preview").innerHTML = lastSvg || "<div class=\"empty\"><strong>暂无结果</strong><span>接口没有返回 SVG。</span></div>";
    $("download-svg").disabled = !lastSvg;
    var analysis = data.analysis || {};
    $("draw-summary").textContent = "学科：" + domainLabel(analysis.domain) + "；图类型：" + (analysis.figure_type || "示意图") + "；画布：" + (analysis.canvas || "");
    renderTags("draw-elements", data.elements || [], "未识别到元素");
    renderTags("draw-relations", data.relations || [], "暂无关系");
    toast("SVG 已生成");
  }).catch(function(error) {
    $("draw-summary").textContent = "生成失败";
    $("svg-preview").innerHTML = "<div class=\"empty\"><strong>生成失败</strong><span>" + escapeHtml(error.message) + "</span></div>";
  }).finally(function() {
    button.disabled = false;
    button.textContent = "生成配图";
  });
}

function downloadSvg() {
  if (!lastSvg) return;
  var blob = new Blob([lastSvg], { type: "image/svg+xml;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = "sci-illustration.svg";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function loadDocuments() {
  $("documents-table").innerHTML = "<div class=\"empty\">正在加载文档列表。</div>";
  request("GET", "/api/documents").then(function(data) {
    var docs = data.documents || [];
    $("documents-count").textContent = "共 " + docs.length + " 个文档";
    if (!docs.length) {
      $("documents-table").innerHTML = "<div class=\"empty\"><strong>暂无文档</strong><span>上传 txt、md、csv 或 json 文件后，系统会提取文本并写入知识库。</span></div>";
      return;
    }
    var html = "<table><thead><tr><th>文件名</th><th>类型</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>";
    docs.forEach(function(doc) {
      html += "<tr>";
      html += "<td><strong>" + escapeHtml(doc.filename) + "</strong></td>";
      html += "<td>" + escapeHtml(doc.file_type || "-") + "</td>";
      html += "<td>" + (doc.vectorized ? "<span class=\"badge biology\">已向量化</span>" : "<span class=\"badge\">待处理</span>") + "</td>";
      html += "<td>" + escapeHtml(doc.created_at || "-") + "</td>";
      html += "<td><button class=\"btn-danger\" type=\"button\" onclick=\"deleteDocument(" + doc.id + ")\">删除</button></td>";
      html += "</tr>";
    });
    html += "</tbody></table>";
    $("documents-table").innerHTML = html;
  }).catch(function(error) {
    $("documents-table").innerHTML = "<div class=\"empty\">文档加载失败：" + escapeHtml(error.message) + "</div>";
  });
}

function uploadDocument() {
  var input = $("doc-upload");
  if (!input.files.length) {
    toast("请选择要上传的文档");
    return;
  }
  var file = input.files[0];
  var form = new FormData();
  form.append("file", file);
  $("doc-upload-btn").disabled = true;
  $("doc-upload-btn").textContent = "上传中";
  fetch("/api/document/upload", { method: "POST", body: form })
    .then(function(response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function(data) {
      if (!data.success) throw new Error(data.error || "上传失败");
      toast("已上传并向量化");
      input.value = "";
      loadDocuments();
      loadDashboard();
    })
    .catch(function(error) {
      toast("上传失败：" + error.message);
    })
    .finally(function() {
      $("doc-upload-btn").disabled = false;
      $("doc-upload-btn").textContent = "上传并向量化";
    });
}

function deleteDocument(id) {
  if (!confirm("确定删除这个文档吗？")) return;
  request("DELETE", "/api/documents/" + id).then(function() {
    toast("文档已删除");
    loadDocuments();
    loadDashboard();
  }).catch(function(error) {
    toast("删除失败：" + error.message);
  });
}

function doSearch() {
  var query = $("search-query").value.trim();
  if (!query) {
    toast("请输入检索关键词");
    return;
  }
  $("search-results").innerHTML = "<div class=\"empty\">正在检索知识库。</div>";
  request("GET", "/api/search?q=" + encodeURIComponent(query)).then(function(data) {
    var results = data.results || [];
    if (!results.length) {
      $("search-results").innerHTML = "<div class=\"empty\">没有找到匹配结果。</div>";
      return;
    }
    var html = "<table><thead><tr><th>术语</th><th>英文名</th><th>学科</th><th>图元</th><th>得分</th><th>来源</th></tr></thead><tbody>";
    results.forEach(function(item) {
      var meta = item.metadata || {};
      html += "<tr>";
      html += "<td><strong>" + escapeHtml(item.term) + "</strong></td>";
      html += "<td>" + escapeHtml(meta.english || "-") + "</td>";
      html += "<td>" + badge(meta.domain) + "</td>";
      html += "<td>" + escapeHtml(meta.shape || "-") + "</td>";
      html += "<td>" + escapeHtml(item.score) + "</td>";
      html += "<td>" + escapeHtml(item.source || "-") + "</td>";
      html += "</tr>";
    });
    html += "</tbody></table>";
    $("search-results").innerHTML = html;
  }).catch(function(error) {
    $("search-results").innerHTML = "<div class=\"empty\">检索失败：" + escapeHtml(error.message) + "</div>";
  });
}

function loadElements() {
  var query = $("element-query").value.trim();
  if (!query) {
    toast("请输入元素推荐需求");
    return;
  }
  $("elements-results").innerHTML = "<div class=\"card empty\">正在推荐元素。</div>";
  request("GET", "/api/elements/suggest?text=" + encodeURIComponent(query)).then(function(data) {
    var elements = data.elements || [];
    if (!elements.length) {
      $("elements-results").innerHTML = "<div class=\"card empty\">没有找到推荐元素。</div>";
      return;
    }
    $("elements-results").innerHTML = elements.map(function(item) {
      return "<div class=\"card compact surface\"><div class=\"metric-label\">" + escapeHtml(item.domain || "元素") + "</div><div style=\"font-weight:700;margin-bottom:6px\">" + escapeHtml(item.name) + "</div><div class=\"muted\">" + escapeHtml(item.english_name || item.english || "") + "</div></div>";
    }).join("");
  }).catch(function(error) {
    $("elements-results").innerHTML = "<div class=\"card empty\">元素推荐失败：" + escapeHtml(error.message) + "</div>";
  });
}

function testDify() {
  $("dify-status-text").textContent = "正在测试连接";
  request("POST", "/api/dify/configure", {
    base_url: $("dify-url").value.trim(),
    api_key: $("dify-key").value.trim()
  }).then(function(data) {
    $("dify-status-text").textContent = data.status === "ok" ? "连接成功" : "连接失败：" + (data.message || data.status);
  }).catch(function(error) {
    $("dify-status-text").textContent = "连接失败：" + error.message;
  });
}

function loadSettings() {
  $("settings-content").innerHTML = "<div class=\"card compact empty\">正在检查本地服务。</div>";
  request("GET", "/api/ollama/status").then(function(data) {
    var models = data.models || [];
    var html = "";
    html += "<div class=\"card compact surface\"><div class=\"metric-label\">Ollama 状态</div><div class=\"metric-value\">" + (data.running ? "运行中" : "未运行") + "</div><div class=\"metric-note\">127.0.0.1:11434</div></div>";
    html += "<div class=\"card compact surface\"><div class=\"metric-label\">本地模型</div><div class=\"metric-value\">" + models.length + "</div><div class=\"metric-note\">" + escapeHtml(models.join(", ") || "暂无模型") + "</div></div>";
    html += "<div class=\"card compact surface\"><div class=\"metric-label\">Web 服务</div><div class=\"metric-value\">运行中</div><div class=\"metric-note\">Flask 开发服务</div></div>";
    $("settings-content").innerHTML = html;
  }).catch(function(error) {
    $("settings-content").innerHTML = "<div class=\"card empty\">设置加载失败：" + escapeHtml(error.message) + "</div>";
  });
}

function closeEditModal() {
  var modal = $("edit-modal");
  modal.classList.remove("open");
  setTimeout(function() { modal.style.display = "none"; }, 250);
}
function saveEditEntry() {
  var id = $("edit-id").value;
  if (!id) return;
  var tags = $("edit-tags").value.split(",").map(function(t) { return t.trim(); }).filter(function(t) { return t; });
  var csStr = $("edit-color-scheme").value.trim();
  var cs = [];
  try { cs = JSON.parse(csStr); } catch(e) { cs = csStr ? [csStr] : []; }
  var payload = {
    name: $("edit-name").value.trim(),
    english: $("edit-english").value.trim(),
    domain: $("edit-domain").value,
    category: $("edit-category").value.trim(),
    shape: $("edit-shape").value.trim(),
    color_scheme: cs,
    tags: tags,
    description: $("edit-description").value.trim()
  };
  request("PUT", "/api/entries/" + id, payload).then(function() {
    toast("条目已更新");
    closeEditModal();
    loadEntries();
  }).catch(function(error) {
    toast("保存失败: " + error.message);
  });
}
</script>
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h3 style="margin:0">编辑知识条目</h3>
      <span class="modal-close" onclick="closeEditModal()" style="cursor:pointer;font-size:22px;color:#667085">&times;</span>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <label class="form-label">中文名称</label>
      <input class="field" id="edit-name" placeholder="输入中文名称">
      <label class="form-label" style="margin-top:10px">英文名称</label>
      <input class="field" id="edit-english" placeholder="输入英文名称">
      <div class="form-row" style="margin-top:10px">
        <div>
          <label class="form-label">学科</label>
          <select class="field" id="edit-domain">
            <option value="">未分类</option>
            <option value="biology">生物</option>
            <option value="chemistry">化学</option>
            <option value="materials">材料</option>
            <option value="environment">环境</option>
          </select>
        </div>
        <div>
          <label class="form-label">类别</label>
          <input class="field" id="edit-category" placeholder="如：细胞结构、分子">
        </div>
      </div>
      <div class="form-row" style="margin-top:10px">
        <div>
          <label class="form-label">图元</label>
          <input class="field" id="edit-shape" placeholder="如：circle, hexagon">
        </div>
        <div>
          <label class="form-label">颜色方案</label>
          <input class="field" id="edit-color-scheme" placeholder='["#xxx","#xxx"]'>
        </div>
      </div>
      <label class="form-label" style="margin-top:10px">标签（逗号分隔）</label>
      <input class="field" id="edit-tags" placeholder="如：细胞, 信号通路">
      <label class="form-label" style="margin-top:10px">描述</label>
      <textarea class="field" id="edit-description" rows="3" placeholder="可选描述"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn" type="button" onclick="closeEditModal()">取消</button>
      <button class="btn-primary" type="button" onclick="saveEditEntry()">保存修改</button>
    </div>
  </div>
</div>
